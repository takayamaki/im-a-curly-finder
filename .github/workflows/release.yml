name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The same as ci.yml.
  RUST_TOOLCHAIN: 1.96.0

jobs:
  release:
    name: build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the tag is the version of every crate and of the app
        run: |
          want="${GITHUB_REF_NAME#v}"
          for v in $(sed -n 's/^version = "\(.*\)"$/\1/p' crates/curly-finder/Cargo.toml crates/curly-gui/Cargo.toml) \
                   $(jq -r .version crates/curly-gui/tauri.conf.json); do
            if [ "$v" != "$want" ]; then
              echo "::error::version $v does not match the tag $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy --target x86_64-pc-windows-gnu
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The checks of ci.yml, so a release is never cut from a tag that would fail them.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo clippy -p curly-gui --features app --target x86_64-pc-windows-gnu --all-targets -- -D warnings

      - name: Build
        run: |
          cargo build --release --locked -p curly-finder
          cargo build --release --locked --target x86_64-pc-windows-gnu -p curly-finder
          cargo build --release --locked --target x86_64-pc-windows-gnu -p curly-gui --features app

      - name: Package
        run: |
          name="curly-finder-$GITHUB_REF_NAME"
          mkdir -p dist
          win="$name-windows-x64"
          mkdir "$win"
          cp target/x86_64-pc-windows-gnu/release/{curly.exe,curly-gui.exe,WebView2Loader.dll} README.md LICENSE "$win"/
          zip -r "dist/$win.zip" "$win"
          linux="$name-linux-x64"
          mkdir "$linux"
          cp target/release/curly README.md LICENSE "$linux"/
          tar czf "dist/$linux.tar.gz" "$linux"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
