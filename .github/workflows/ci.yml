name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA (a tag can be moved); Dependabot updates the SHA and the
# version in the comment together.

env:
  CARGO_TERM_COLOR: always
  # The same as mise.toml of the development container, so new lints do not turn CI red by surprise.
  RUST_TOOLCHAIN: 1.96.0

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup comes with the runner: no third-party action to install Rust.
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows-app:
    name: clippy of the Tauri app (x86_64-pc-windows-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --target x86_64-pc-windows-gnu
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy -p curly-gui --features app --target x86_64-pc-windows-gnu --all-targets -- -D warnings
