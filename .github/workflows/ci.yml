name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are written as tags and pinned to commits by .github/workflows/actions.lock
# (gh actions-lock). Dependabot updates the tag and the lockfile together.

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # rustup comes with the runner: no third-party action to install Rust.
      # The version, components and targets come from rust-toolchain.toml (Dependabot updates it).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows-app:
    name: clippy of the Tauri app (x86_64-pc-windows-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      # The version, components and targets come from rust-toolchain.toml (Dependabot updates it).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo clippy -p curly-gui --features app --target x86_64-pc-windows-gnu --all-targets -- -D warnings
