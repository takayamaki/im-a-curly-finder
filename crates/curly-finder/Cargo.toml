[package]
name = "curly-finder"
version = "0.1.0"
edition = "2024"
description = "I'm a Curly Finder: find files by the {tags} in their paths"
license = "MIT"

[[bin]]
name = "curly"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-normalization = "0.1.25"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
