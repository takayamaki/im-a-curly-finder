<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>I'm a Curly Finder</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px system-ui, sans-serif; margin: 0; background: #1e1e1e; color: #ddd; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; gap: 8px; padding: 8px; border-bottom: 1px solid #333; }
  #q { flex: 1; padding: 6px 8px; font-size: 16px; background: #2a2a2a; color: #eee; border: 1px solid #555; border-radius: 4px; }
  button { background: #2a2a2a; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 0 12px; cursor: pointer; }
  #bar { display: flex; gap: 12px; padding: 4px 8px; font-size: 12px; color: #999; }
  #folder { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { white-space: nowrap; }
  #skipped { white-space: nowrap; color: #db8; }
  #skipped:empty { display: none; }
  #status.error { color: #f77; }
  #chips { flex: none; display: flex; flex-wrap: wrap; gap: 4px; padding: 0 8px 6px; max-height: 84px; overflow-y: auto; }
  #chips:empty { display: none; }
  /* The extension drop-down: a button and, under it, groups of check boxes. */
  #exts-box { position: relative; display: flex; }
  #exts-menu { position: absolute; top: calc(100% + 4px); right: 0; z-index: 10; min-width: 160px; max-height: 70vh; overflow-y: auto; padding: 6px 0; background: #2a2a2a; border: 1px solid #555; border-radius: 4px; box-shadow: 0 4px 12px #0008; }
  #exts-menu label { display: flex; align-items: center; gap: 6px; padding: 2px 12px; white-space: nowrap; cursor: pointer; }
  #exts-menu label:hover { background: #333; }
  #exts-menu .ext { padding-left: 32px; }
  #exts-menu input { accent-color: #e6a; margin: 0; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid #5a3a4c; background: #2a2025; color: #e6a; }
  .chip .count { color: #a78; margin-left: 4px; }
  .chip.on { background: #e6a; color: #1e1e1e; border-color: #e6a; }
  .chip.on .count { color: #4a2a3a; }
  ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  li { display: flex; gap: 8px; align-items: baseline; padding: 4px 8px; border-bottom: 1px solid #2c2c2c; cursor: grab; user-select: none; white-space: nowrap; }
  li:hover { background: #333; }
  li > span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* When the window is narrow, the folder shrinks first, then the tags, then the name. */
  .name { flex: 0 1 auto; }
  .tags { flex: 0 2 auto; color: #e6a; }
  /* rtl puts the ellipsis on the left, so the folder nearest to the file stays visible.
     The <bdi> inside keeps the path itself left to right. */
  .dir { flex: 1 1 0; color: #888; font-size: 12px; direction: rtl; text-align: right; }
</style>
</head>
<body>
<header>
  <button id="choose" title="Choose the folder to search">Folder…</button>
  <input id="q" placeholder="words, #tags, | for OR, - for NOT" autofocus spellcheck="false">
  <div id="exts-box">
    <button id="exts" title="Choose the kinds of files to list" aria-haspopup="true" aria-expanded="false">All ▾</button>
    <div id="exts-menu" hidden></div>
  </div>
  <button id="rescan" title="Scan the folder again">Rescan</button>
</header>
<div id="bar"><span id="folder"></span><span id="skipped"></span><span id="status"></span></div>
<div id="chips"></div>
<ul id="list"></ul>
<script>
const { invoke, Channel } = window.__TAURI__.core;
const q = document.getElementById("q");
const list = document.getElementById("list");
const status = document.getElementById("status");
const folder = document.getElementById("folder");
const skipped = document.getElementById("skipped");
const chips = document.getElementById("chips");

// The tags chosen by clicking a chip. They stay out of the input;
// the engine joins them to the query with AND.
let chosen = [];

// The extension drop-down. The groups come from the app (exts.rs); the checked extensions are
// kept in settings.json. Every one or none checked means any file (the app decides, request_exts).
const extsButton = document.getElementById("exts");
const extsMenu = document.getElementById("exts-menu");
let extGroups = [];
let checkedExts = new Set();

function groupState(group) {
  const n = group.exts.filter(e => checkedExts.has(e)).length;
  return n === 0 ? "off" : n === group.exts.length ? "on" : "some";
}

function extsLabel() {
  const states = extGroups.map(groupState);
  if (states.every(s => s === "on") || states.every(s => s === "off")) return "All";
  return extGroups
    .filter((g, i) => states[i] !== "off")
    .map(g => g.name + (groupState(g) === "some" ? " (some)" : ""))
    .join(" + ");
}

function showExts() {
  extsButton.textContent = extsLabel() + " ▾";
  for (const box of extsMenu.querySelectorAll("input")) {
    if (box.dataset.ext) {
      box.checked = checkedExts.has(box.dataset.ext);
    } else {
      const state = groupState(extGroups[Number(box.dataset.group)]);
      box.checked = state === "on";
      box.indeterminate = state === "some";
    }
  }
}

function extsChanged() {
  showExts();
  invoke("save_exts", { exts: [...checkedExts] }).catch(e => setStatus(String(e), true));
  search();
}

function checkbox(text, className, onChange) {
  const label = document.createElement("label");
  label.className = className;
  const box = document.createElement("input");
  box.type = "checkbox";
  box.addEventListener("change", onChange);
  label.append(box, text);
  return [label, box];
}

function buildExtsMenu() {
  extsMenu.replaceChildren();
  extGroups.forEach((group, i) => {
    // A group that is on turns all of its extensions off; off or partly checked turns them all on.
    const [label, box] = checkbox(group.name, "group", () => {
      const on = groupState(group) !== "on";
      for (const e of group.exts) on ? checkedExts.add(e) : checkedExts.delete(e);
      extsChanged();
    });
    box.dataset.group = i;
    extsMenu.append(label);
    for (const ext of group.exts) {
      const [label, box] = checkbox(ext, "ext", () => {
        checkedExts.has(ext) ? checkedExts.delete(ext) : checkedExts.add(ext);
        extsChanged();
      });
      box.dataset.ext = ext;
      extsMenu.append(label);
    }
  });
  showExts();
}

function openExts(open) {
  extsMenu.hidden = !open;
  extsButton.setAttribute("aria-expanded", String(open));
}

extsButton.addEventListener("click", () => openExts(extsMenu.hidden));
document.addEventListener("mousedown", e => {
  if (!extsMenu.hidden && !e.target.closest("#exts-box")) openExts(false);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !extsMenu.hidden) {
    openExts(false);
    extsButton.focus();
    e.stopPropagation();
  }
}, true);

async function loadExts() {
  const choices = await invoke("ext_choices");
  extGroups = choices.groups;
  checkedExts = new Set(choices.checked);
  buildExtsMenu();
}

function toggleTag(tag) {
  chosen = tag.chosen ? chosen.filter(t => t !== tag.tag) : [...chosen, tag.tag];
  q.focus();
  search();
}

function chip(tag) {
  const b = document.createElement("button");
  b.className = tag.chosen ? "chip on" : "chip";
  b.textContent = "#" + tag.tag;
  if (tag.count !== undefined) {
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = tag.count;
    b.append(count);
  }
  b.addEventListener("click", () => toggleTag(tag));
  return b;
}
// The app icon, shown under the cursor while dragging.
const DRAG_ICON = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAgElEQVR4nO3WwRGAMAhE0ZRqSZZoJ3p2TAiQwK4zHLjuf6dou46zIQ8a/zXgFi4UIIVdkIiwCRIdnyIy4iIiKz5EZMa7CEpAZPyDoANkxF+IAhSgAHTvAAUA/i2gAMD/ByIQ3cYMsAsx3NcAVhHithbggag2rQANxLTlBWw7OOABUrJvV5TdnlsAAAAASUVORK5CYII=";

function setStatus(text, isError = false) {
  status.textContent = text;
  status.className = isError ? "error" : "";
}

function span(className, text) {
  const el = document.createElement("span");
  el.className = className;
  el.textContent = text;
  return el;
}

function row(entry) {
  const li = document.createElement("li");
  li.append(span("name", entry.name));
  if (entry.tags.length) li.append(span("tags", entry.tags.map(t => "#" + t).join(" ")));
  const dir = span("dir", "");
  const bdi = document.createElement("bdi");
  bdi.textContent = entry.dir;
  dir.append(bdi);
  li.append(dir);
  li.dataset.path = entry.path;
  li.title = entry.path;
  return li;
}

let latest = 0;
async function search() {
  const ticket = ++latest;
  try {
    const found = await invoke("query", { expr: q.value, chosen, exts: [...checkedExts] });
    if (ticket !== latest) return;
    const shown = found.entries.length;
    setStatus(shown < found.total ? `${found.total} files (showing ${shown})` : `${found.total} files`);
    list.replaceChildren(...found.entries.map(row));
    chips.replaceChildren(...found.tags.map(chip));
  } catch (e) {
    if (ticket !== latest) return;
    setStatus(String(e), true);
    // Keep the chosen tags on screen so they can still be turned off.
    chips.replaceChildren(...chosen.map(tag => chip({ tag, chosen: true })));
  }
}

async function showFolder() {
  const current = await invoke("current_folder");
  folder.textContent = current.root ?? "No folder";
  folder.title = current.root ?? "";
  const n = current.skipped.length;
  skipped.textContent = n === 0 ? "" : n === 1 ? "1 folder could not be read" : `${n} folders could not be read`;
  skipped.title = current.skipped.join("\n");
  return current;
}

document.getElementById("choose").addEventListener("click", async () => {
  const dir = await invoke("plugin:dialog|open", { options: { directory: true, title: "Choose the folder to search" } });
  if (!dir) return;
  setStatus("Scanning...");
  try {
    await invoke("open_folder", { dir });
    await showFolder();
    await search();
  } catch (e) {
    await showFolder();
    await search();
    setStatus(String(e), true);
  }
});

document.getElementById("rescan").addEventListener("click", async () => {
  setStatus("Scanning...");
  try {
    await invoke("rescan");
    await showFolder();
    await search();
  } catch (e) {
    setStatus(String(e), true);
  }
});

// Start a native drag once the mouse moves a few pixels with the button held.
let pressed = null;
list.addEventListener("mousedown", e => {
  const li = e.target.closest("li");
  if (li && e.button === 0) pressed = { path: li.dataset.path, x: e.clientX, y: e.clientY };
});
window.addEventListener("mouseup", () => { pressed = null; });
window.addEventListener("mousemove", async e => {
  if (!pressed || Math.hypot(e.clientX - pressed.x, e.clientY - pressed.y) < 5) return;
  const path = pressed.path;
  pressed = null;
  try {
    await invoke("plugin:drag|start_drag", { item: [path], image: DRAG_ICON, options: { mode: "copy" }, onEvent: new Channel() });
  } catch (err) {
    setStatus("Drag failed: " + err, true);
  }
});

q.addEventListener("input", search);
Promise.all([showFolder(), loadExts()]).then(async ([current]) => {
  await search();
  if (current.error) setStatus(current.error, true);
});
q.addEventListener("keydown", e => { if (e.key === "Escape") { q.value = ""; chosen = []; search(); } });
</script>
</body>
</html>
