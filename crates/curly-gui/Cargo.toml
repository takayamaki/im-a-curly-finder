[package]
name = "curly-gui"
version = "0.1.0"
edition = "2024"
description = "I'm a Curly Finder: a GUI to find clips and drag them into other apps"
license = "MIT"

[[bin]]
name = "curly-gui"
path = "src/main.rs"
required-features = ["app"]

[features]
# The Tauri app. Off by default so that the library builds and tests without WebView libraries.
app = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-drag",
    "dep:tauri-plugin-opener",
    "dep:tauri-build",
    "dep:windows",
]

[dependencies]
curly-finder = { path = "../curly-finder" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.1", optional = true }
tauri-plugin-dialog = { version = "2.8.1", optional = true }
tauri-plugin-drag = { version = "2.1.1", optional = true }
tauri-plugin-opener = { version = "2.7.2", optional = true }

# "Open with…" of the context menu (SHOpenWithDialog).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_Shell"], optional = true }

[build-dependencies]
tauri-build = { version = "2.7.1", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
